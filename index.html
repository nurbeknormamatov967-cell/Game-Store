<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Steam Games</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body class="">

	<header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/85 backdrop-blur-md border-b border-white/10">
		<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
			<div class="flex justify-between h-16 items-center gap-4">
				<a href="#" class="flex items-center gap-2">
					<div class="text-[40px]"><i class="bx bxl-steam"></i></div>
					<span class="hidden sm:block  text-2xl font-semibold">GameStore</span>
				</a>
				<nav class="hidden md:block">
					<ul class="flex gap-4 items-center text-cm lg:text-lg to-slate-300">
						<li><a class="rounded-xl px-4 py-2 transition hover:bg-white/10 hover:text-white" href="#">Home</a></li>
						<li><a class="rounded-xl px-4 py-2 transition hover:bg-white/10 hover:text-white" href="#sales">Sales</a></li>
						<li><a class="rounded-xl px-4 py-2 transition hover:bg-white/10 hover:text-white" href="#games">Games</a></li>
						<li><a class="rounded-xl px-4 py-2 transition hover:bg-white/10 hover:text-white" href="#contact">Contact</a></li>
					</ul>
				</nav>
				<div class="flex gap-2">
					<button class="md:hidden text-[30px] hover:text-white cursor-pointer hover:bg-white/10 roumded-md px-2 flex items-center">
						<i class="bx bx-menu"></i>
					</button>
					<button class="text-[25px] hover:text-white/50 cursor-pointer rounded-md p-2 flex items-center border border-white/10 transition-all ">
						<i class="bx bx-moon"></i>
						<!-- <i class="bx bx-sun"></i> -->
					</button>
				</div>
			</div>
		</div>
	</header>

	<main class="pt-20">
		<section id="hero" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="relative overflow-hidden rounded-3xl border border-white/10 min-h-[70vh] shadow-2xl">
        <img src="./img/cs2.jpg" alt="Counter Strike 2" id="banner-image" class="absolute inset-0 h-full w-full object-cover">

        <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/70 to-slate-900/20"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>

        <div class="relative z-10 flex min-h-[50vh] items-end">
          <div class="max-w-3xl p-6 sm:p-8 lg:p-12">
            <span class="inline-flex rounded-full border border-blue-400/30 bg-blue-500/15 px-4 py-2 text-sm font-medium text-blue-300">
              Игра недели
            </span>

            <h1 id="banner-title" class="text-white mt-4 text-3xl font-bold leading-tight sm:text-5xl lg:text-6xl">Counter Strike 2  shooter Game</h1>

            <div class="mt-4 flex flex-wrap items-center gap-4">
              <span id="banner-discount" class="inline-flex rounded-2xl bg-emerald-500/20 px-4 py-2 text-xl font-semibold text-emerald-300">83% скидка</span>

              <span id="banner-store" class="rounded-2xl border border-white/10 bg-white/10 px-4 py-2 text-sm text-slate-200">WinGameStore</span>
            </div>

            <p id="banner-description" class="mt-4 max-w-2xl text-base leading-7 text-slate-200 sm:text-lg">Текущая цена: $13.59. Старая цена: $79.99. Магазин: WinGameStore.</p>

            <div class="mt-6 flex flex-wrap items-center gap-4">
              <div class="rounded-2xl border border-white/10 bg-black/30 px-5 py-3">
                <p class="text-xs uppercase tracking-widest text-slate-400">Сейчас</p>
                <p id="banner-price" class="text-2xl font-bold text-white">$13.59</p>
              </div>

              <div class="rounded-2xl border border-white/10 bg-black/30 px-5 py-3">
                <p class="text-xs uppercase tracking-widest text-slate-400">Было</p>
                <p id="banner-normal-price" class="text-2xl font-bold text-slate-300 line-through">$79.99</p>
              </div>

              <a id="banner-link" href="https://store.steampowered.com/app/730/CounterStrike_2/?l=english&curator_clanid=31238551&gad_source=1&gad_campaignid=23519058958&gbraid=0AAAAAqD7is1M4e7GpACpj04zwiCabRePs&gclid=CjwKCAjwzevPBhBaEiwAplAxvv6-1zV86vcKLI2qdhznGxn60rPXTLZbi-bahf90ddE2ODHxxBIRVRoCResQAvD_BwE" target="_blank" class="rounded-2xl bg-blue-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-blue-500">
                Смотреть предложение
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
	</main>

	<footer>
		<h1>Salom Nurbek</h1>
	</footer>

	<script src="./script.js"></script>
</body>

</html>
